# Apply rclone Google Drive OAuth on the staging VPS (non-interactive).
#
# Required repository secrets:
#   VPS_HOST, VPS_SSH_KEY (same as deploy-staging)
#   VPS_USER (optional, defaults to root)
#   RCLONE_OAUTH_TOKEN_JSON â€” full JSON from: rclone authorize drive
#
# Optional: RCLONE_REMOTE already in GitHub secrets for env sync after apply.
#
# Do not commit rclone.conf or paste tokens into the repo.

name: Setup rclone on VPS

on:
  workflow_dispatch:

concurrency:
  group: setup-rclone-vps
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync scripts to VPS
        env:
          VPS_USER: ${{ secrets.VPS_USER || 'root' }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          rsync -avz \
            scripts/vps-apply-rclone-token.sh \
            scripts/vps-sync-supabase-env.sh \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            "${VPS_USER}@${VPS_HOST}:/root/creator-ai-studio/scripts/"

      - name: Apply OAuth token to rclone config volume
        env:
          VPS_USER: ${{ secrets.VPS_USER || 'root' }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          RCLONE_OAUTH_TOKEN_JSON: ${{ secrets.RCLONE_OAUTH_TOKEN_JSON }}
        run: |
          if [ -z "${RCLONE_OAUTH_TOKEN_JSON}" ]; then
            echo "::error::GitHub secret RCLONE_OAUTH_TOKEN_JSON is not set."
            echo "On your PC run: rclone authorize drive"
            echo "Add the full JSON line to Settings â†’ Secrets â†’ Actions â†’ RCLONE_OAUTH_TOKEN_JSON"
            exit 1
          fi
          printf '%s' "${RCLONE_OAUTH_TOKEN_JSON}" | \
            ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
              "${VPS_USER}@${VPS_HOST}" \
              'cat > /tmp/rclone-oauth.json && chmod 600 /tmp/rclone-oauth.json'
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "${VPS_USER}@${VPS_HOST}" \
            "RCLONE_OAUTH_TOKEN_FILE=/tmp/rclone-oauth.json bash /root/creator-ai-studio/scripts/vps-apply-rclone-token.sh; rm -f /tmp/rclone-oauth.json"

      - name: Sync RCLONE_REMOTE env on VPS
        env:
          VPS_USER: ${{ secrets.VPS_USER || 'root' }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          RCLONE_REMOTE: ${{ secrets.RCLONE_REMOTE }}
        run: |
          if [ -z "${RCLONE_REMOTE}" ]; then
            echo "::warning::RCLONE_REMOTE secret not set; skipping env sync (apply script still updated .env.supabase.local)"
            exit 0
          fi
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "${VPS_USER}@${VPS_HOST}" bash -s <<EOF
          RCLONE_REMOTE=${RCLONE_REMOTE@Q} \
          RCLONE_CONFIG=/config/rclone/rclone.conf \
          bash /root/creator-ai-studio/scripts/vps-sync-supabase-env.sh
          EOF

      - name: Verify rclone on VPS
        env:
          VPS_USER: ${{ secrets.VPS_USER || 'root' }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "${VPS_USER}@${VPS_HOST}" bash -s <<'EOF'
          set -euo pipefail
                    API=$(docker ps -q --filter "name=api-" | head -1)
          if [ -z "${API}" ]; then
            echo "No API container; verifying on host primary volume"
            export RCLONE_CONFIG=/var/lib/docker/volumes/creator-ai-studio-rclone-config/_data/rclone.conf
            rclone lsd gdrive:Creator-AI-Studio/episodes
          else
            docker exec "${API}" rclone lsd gdrive:Creator-AI-Studio/episodes
          fi
          EOF

      - name: Verify storage API (optional)
        env:
          VPS_USER: ${{ secrets.VPS_USER || 'root' }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          CAS_API_KEY: ${{ secrets.CAS_API_KEY }}
        run: |
          if [ -z "${CAS_API_KEY}" ]; then
            echo "CAS_API_KEY not set; skipping storage API check"
            exit 0
          fi
          curl -sfS -H "Authorization: Bearer ${CAS_API_KEY}" \
            "https://creator-ai-studio.217.76.56.66.sslip.io/api/system/storage" | \
            python3 -c "import json,sys; d=json.load(sys.stdin); assert d.get('archiveConfigured') is True, d; print('archiveConfigured:', d.get('archiveConfigured'))"
