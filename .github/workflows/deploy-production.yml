# Production deploy — push to `main` or manual dispatch.
# Requires separate Coolify app + secrets from staging.

name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_HOST_PROD || secrets.VPS_HOST }}" > /dev/null
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST_PROD || secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync code to VPS
        env:
          VPS_USER: ${{ secrets.VPS_USER || 'root' }}
          VPS_HOST: ${{ secrets.VPS_HOST_PROD || secrets.VPS_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "${VPS_USER}@${VPS_HOST}" \
            "git config --global --add safe.directory /root/creator-ai-studio 2>/dev/null || true"
          rsync -avz \
            --exclude node_modules \
            --exclude .git \
            --exclude episodes \
            --exclude '.env*' \
            --exclude '*.enc' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            ./ "${VPS_USER}@${VPS_HOST}:/root/creator-ai-studio/"

      - name: Redeploy production stack
        env:
          VPS_USER: ${{ secrets.VPS_USER || 'root' }}
          VPS_HOST: ${{ secrets.VPS_HOST_PROD || secrets.VPS_HOST }}
          DEPLOY_TAG: production-${{ github.sha }}
          COMPOSE_FILE: deploy/docker-compose.production.yml
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "${VPS_USER}@${VPS_HOST}" \
            "COMPOSE_FILE=deploy/docker-compose.production.yml bash /root/creator-ai-studio/scripts/vps-redeploy.sh ${DEPLOY_TAG}"
