# Deploy staging to VPS on push to `staging`.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   VPS_HOST      — e.g. 217.76.56.66
#   VPS_SSH_KEY   — private SSH key (PEM) for deploy user
# Optional:
#   VPS_USER      — defaults to root
#
# The VPS must have Docker, the Coolify app at /data/coolify/applications/...,
# and /root/creator-ai-studio as sync target.

name: Deploy Staging

on:
  push:
    branches: [staging]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync code to VPS
        env:
          VPS_USER: ${{ secrets.VPS_USER || 'root' }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          rsync -avz \
            --exclude node_modules \
            --exclude .git \
            --exclude episodes \
            --exclude '.env*' \
            --exclude '*.enc' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            ./ "${VPS_USER}@${VPS_HOST}:/root/creator-ai-studio/"

      - name: Redeploy staging stack
        env:
          VPS_USER: ${{ secrets.VPS_USER || 'root' }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          DEPLOY_TAG: e2e-pipeline-${{ github.sha }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "${VPS_USER}@${VPS_HOST}" \
            "bash /root/creator-ai-studio/scripts/vps-redeploy.sh ${DEPLOY_TAG}"
