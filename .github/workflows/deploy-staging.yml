# Deploy staging to VPS on push to `staging`.
#
# Required repository secrets (Settings â†’ Secrets and variables â†’ Actions):
#   VPS_HOST      â€” e.g. 217.76.56.66
#   VPS_SSH_KEY   â€” private SSH key (PEM) for deploy user
# Supabase/church platform secrets (synced to /root/creator-ai-studio/.env.supabase.local):
#   VPS_USER                  â€” defaults to root
#   SUPABASE_URL              â€” e.g. https://iiokqyedkylwhonbrrvo.supabase.co
#   SUPABASE_ANON_KEY         â€” Dashboard â†’ API â†’ anon / publishable key
#   SUPABASE_SERVICE_ROLE_KEY â€” Dashboard â†’ API â†’ service_role key
#   SUPABASE_JWT_SECRET       â€” Dashboard â†’ API â†’ JWT Secret (required if API JWT auth enabled)
#   CAS_API_KEY               â€” worker + machine-to-machine Bearer
#   GEMINI_API_KEY              â€” API Gemini provider (optional)
#   RCLONE_REMOTE               â€” e.g. gdrive:Creator-AI-Studio/episodes (optional)
#   RCLONE_OAUTH_TOKEN_JSON     â€” OAuth JSON for setup-rclone-vps workflow (optional, one-time)
#
# The VPS must have Docker, the Coolify app at /data/coolify/applications/...,
# and /root/creator-ai-studio as sync target.

name: Deploy Staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync code to VPS
        env:
          VPS_USER: ${{ secrets.VPS_USER || 'root' }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "${VPS_USER}@${VPS_HOST}" \
            "git config --global --add safe.directory /root/creator-ai-studio 2>/dev/null || true"
          rsync -avz \
            --exclude node_modules \
            --exclude .git \
            --exclude episodes \
            --exclude '.env*' \
            --exclude '*.enc' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            ./ "${VPS_USER}@${VPS_HOST}:/root/creator-ai-studio/"

      - name: Post-rsync VPS cleanup
        env:
          VPS_USER: ${{ secrets.VPS_USER || 'root' }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "${VPS_USER}@${VPS_HOST}" \
            "bash /root/creator-ai-studio/scripts/vps-post-rsync.sh"

      - name: Verify Supabase secrets for church platform build/runtime
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
        run: |
          missing=()
          [ -n "${SUPABASE_URL}" ] || missing+=(SUPABASE_URL)
          [ -n "${SUPABASE_ANON_KEY}" ] || missing+=(SUPABASE_ANON_KEY)
          [ -n "${SUPABASE_SERVICE_ROLE_KEY}" ] || missing+=(SUPABASE_SERVICE_ROLE_KEY)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Church platform requires Supabase GitHub secrets: ${missing[*]}."
            echo "Add them under Settings â†’ Secrets â†’ Actions. The web image needs SUPABASE_URL/SUPABASE_ANON_KEY at build time; the API needs SUPABASE_SERVICE_ROLE_KEY at runtime."
            echo "See docs/02-operations/SUPABASE_AUTH.md"
            exit 1
          fi
          if [ -n "${SUPABASE_JWT_SECRET}" ]; then
            echo "Supabase JWT auth secret is configured (value redacted)."
          fi

      - name: Sync Supabase env on VPS
        env:
          VPS_USER: ${{ secrets.VPS_USER || 'root' }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CAS_API_KEY: ${{ secrets.CAS_API_KEY }}
          CAS_SECRETS_KEY: ${{ secrets.CAS_SECRETS_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RCLONE_REMOTE: ${{ secrets.RCLONE_REMOTE }}
        run: |
          RCLONE_REMOTE="${RCLONE_REMOTE:-gdrive:Creator-AI-Studio/episodes}"
          if printf '%s' "${RCLONE_REMOTE}" | grep -qE 'access_token|"token_type"'; then
            echo "::error::RCLONE_REMOTE must be a rclone remote path (gdrive:...), not OAuth JSON. Use RCLONE_OAUTH_TOKEN_JSON for OAuth."
            exit 1
          fi
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "${VPS_USER}@${VPS_HOST}" bash -s <<EOF
          SUPABASE_URL=${SUPABASE_URL@Q} \
          SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY@Q} \
          SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET@Q} \
          SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY@Q} \
          CAS_API_KEY=${CAS_API_KEY@Q} \
          CAS_SECRETS_KEY=${CAS_SECRETS_KEY@Q} \
          GEMINI_API_KEY=${GEMINI_API_KEY@Q} \
          RCLONE_REMOTE=${RCLONE_REMOTE@Q} \
          RCLONE_CONFIG=/config/rclone/rclone.conf \
          bash /root/creator-ai-studio/scripts/vps-sync-supabase-env.sh
          EOF


      - name: Apply rclone OAuth token (if configured)
        env:
          VPS_USER: ${{ secrets.VPS_USER || 'root' }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          RCLONE_OAUTH_TOKEN_JSON: ${{ secrets.RCLONE_OAUTH_TOKEN_JSON }}
        run: |
          if [ -z "${RCLONE_OAUTH_TOKEN_JSON}" ]; then
            echo "RCLONE_OAUTH_TOKEN_JSON not set; skipping rclone token apply"
            exit 0
          fi
          printf '%s' "${RCLONE_OAUTH_TOKEN_JSON}" | \
            ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
              "${VPS_USER}@${VPS_HOST}" \
              'cat > /tmp/rclone-oauth.json && chmod 600 /tmp/rclone-oauth.json'
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "${VPS_USER}@${VPS_HOST}" \
            "RCLONE_OAUTH_TOKEN_FILE=/tmp/rclone-oauth.json bash /root/creator-ai-studio/scripts/vps-apply-rclone-token.sh; rm -f /tmp/rclone-oauth.json"
      - name: Redeploy staging stack
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RCLONE_REMOTE: ${{ secrets.RCLONE_REMOTE }}
          VPS_USER: ${{ secrets.VPS_USER || 'root' }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          DEPLOY_TAG: e2e-pipeline-${{ github.sha }}
          COMPOSE_FILE: deploy/docker-compose.staging.yml
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "${VPS_USER}@${VPS_HOST}" \
            "set -a; [ -f /root/creator-ai-studio/.env.supabase.local ] && . /root/creator-ai-studio/.env.supabase.local; set +a; COMPOSE_FILE=deploy/docker-compose.staging.yml bash /root/creator-ai-studio/scripts/vps-redeploy.sh ${DEPLOY_TAG}"

      - name: Auto-archive if over episode limit
        env:
          VPS_USER: ${{ secrets.VPS_USER || 'root' }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "${VPS_USER}@${VPS_HOST}" \
            "bash /root/creator-ai-studio/scripts/vps-archive-if-over-limit.sh || true"

