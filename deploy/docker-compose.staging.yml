services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 3000
      LOCAL_STORAGE_PATH: /data/episodes
      CAS_DATA_PATH: /data
      CAS_PUBLIC_URL: ${CAS_PUBLIC_URL:-https://creator-ai-studio.217.76.56.66.sslip.io}
      CAS_SECRETS_KEY: ${CAS_SECRETS_KEY:?Set CAS_SECRETS_KEY in Coolify (32+ chars) to enable UI API key storage}
      CAS_API_KEY: ${CAS_API_KEY:-}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      RCLONE_REMOTE: ${RCLONE_REMOTE:-}
      RCLONE_CONFIG: ${RCLONE_CONFIG:-/config/rclone/rclone.conf}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      PIPER_BIN: ${PIPER_BIN:-}
      PIPER_MODEL: ${PIPER_MODEL:-}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      # FASE 8: staging valida flujos reales — mocks bloqueados por defecto.
      ALLOW_MOCKS: ${ALLOW_MOCKS:-false}
      AI_ALLOW_DEMO_FALLBACK: ${AI_ALLOW_DEMO_FALLBACK:-false}
    volumes:
      - creator-ai-studio-staging-data:/data
      - ${RCLONE_CONFIG_VOLUME:-creator-ai-studio-rclone-config}:/config/rclone:ro
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        # Vite embeds these at image build time — export before `docker compose up --build`
        # or use scripts/vps-redeploy.sh on the VPS (reads .env.supabase.local).
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-${SUPABASE_URL:-}}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-${SUPABASE_ANON_KEY:-}}
    expose:
      - "8080"
    labels:
      - coolify.managed=true
      - coolify.proxy=true
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
    environment:
      NODE_ENV: production
      LOCAL_STORAGE_PATH: /data/episodes
      API_BASE_URL: http://api:3000/api
      WORKER_POLL_INTERVAL_MS: 5000
      REDIS_URL: redis://redis:6379
      CAS_API_KEY: ${CAS_API_KEY:-}
    volumes:
      - creator-ai-studio-staging-data:/data
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    restart: unless-stopped

volumes:
  creator-ai-studio-staging-data:
  creator-ai-studio-rclone-config:
