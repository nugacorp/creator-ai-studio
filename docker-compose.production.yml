# Production stack — separate volume and secrets from staging (FASE 11).
# Deploy via .github/workflows/deploy-production.yml on push to `main`.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 3000
      LOCAL_STORAGE_PATH: /data/episodes
      CAS_PUBLIC_URL: ${CAS_PUBLIC_URL:?Set production public URL}
      CAS_SECRETS_KEY: ${CAS_SECRETS_KEY:?Set CAS_SECRETS_KEY}
      CAS_API_KEY: ${CAS_API_KEY:?Set CAS_API_KEY for worker auth}
      REDIS_URL: redis://redis:6379
      RCLONE_REMOTE: ${RCLONE_REMOTE:-}
      RCLONE_CONFIG: ${RCLONE_CONFIG:-/config/rclone/rclone.conf}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-${VITE_SUPABASE_ANON_KEY:-}}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      EPISODE_METADATA_SOURCE: ${EPISODE_METADATA_SOURCE:-supabase}
      ALLOW_MOCKS: "false"
      AI_ALLOW_DEMO_FALLBACK: "false"
      AI_FALLBACK_ENABLED: ${AI_FALLBACK_ENABLED:-true}
    volumes:
      - creator-ai-studio-production-episodes:/data/episodes
      - ${RCLONE_CONFIG_VOLUME:-creator-ai-studio-production-rclone}:/config/rclone:ro
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-${SUPABASE_URL:-}}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-${SUPABASE_ANON_KEY:-}}
    expose:
      - "8080"
    labels:
      - coolify.managed=true
      - coolify.proxy=true
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      NODE_ENV: production
      API_BASE_URL: http://api:3000/api
      WORKER_POLL_INTERVAL_MS: 5000
      REDIS_URL: redis://redis:6379
      CAS_API_KEY: ${CAS_API_KEY:?Set CAS_API_KEY}
    volumes:
      - creator-ai-studio-production-episodes:/data/episodes
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    restart: unless-stopped

volumes:
  creator-ai-studio-production-episodes:
  creator-ai-studio-production-rclone:
