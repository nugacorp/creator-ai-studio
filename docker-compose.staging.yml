services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 3000
      LOCAL_STORAGE_PATH: /data/episodes
      REDIS_URL: ${REDIS_URL:-}
    volumes:
      - creator-ai-studio-staging-episodes:/data/episodes
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  worker:
    profiles:
      - worker
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      NODE_ENV: production
      LOCAL_STORAGE_PATH: /data/episodes
      API_BASE_URL: http://api:3000/api
      WORKER_POLL_INTERVAL_MS: 5000
      REDIS_URL: redis://redis:6379
    volumes:
      - creator-ai-studio-staging-episodes:/data/episodes
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  redis:
    profiles:
      - worker
    image: redis:7-alpine
    expose:
      - "6379"
    restart: unless-stopped

volumes:
  creator-ai-studio-staging-episodes:
